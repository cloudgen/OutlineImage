[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "OutlineImage"
version = "1.0.1"
description = "OutlineImage writes a detailed outline image for each picture in a folder."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Wilgat Wong", email = "wilgat.wong@gmail.com"}
]
keywords = ["CLI", "TUI", "outline", "image"]

dependencies = [
    "ChronicleLogger>=1.3.1",
    "numpy>=2.3.0",
    "Pillow>=12.1.0",
    "opencv-python-headless>=5.0.0.93",
    "rembg>=2.0.85",
]

[project.urls]
Homepage = "https://github.com/cloudgen/OutlineImage"
Repository = "https://github.com/cloudgen/OutlineImage"
Issues = "https://github.com/cloudgen/OutlineImage/issues"

[project.scripts]
outline-image = "OutlineImage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
